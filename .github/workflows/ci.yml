name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest  # 24.04 вместо 22.04
    strategy:
      matrix:
        python-version: ["3.12", "3.11"]  # современные LTS
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-test.txt  # тесты только
      - name: pytest
        run: pytest tests/ -v --tb=short
      
      # dev tools в отдельном job
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dev-${{ hashFiles('**/requirements-dev.txt') }}
      
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      
      - name: black
        run: black --diff --check src/
      
      - name: isort
        run: isort --diff --check-only src/
      
      - name: flake8
        run: flake8 src/
      
      - name: mypy
        run: mypy src/ --strict
