name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.7"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pytest
        run: pytest tests

      - name: mypy
        run: mypy src/

      - name: black
        run: black --diff --check src/

      - name: isort
        run: isort --diff --check-only src/

      - name: flake8
        run: flake8 src/
